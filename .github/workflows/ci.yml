name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test:run

      - name: Receiving contracts and pinned artifacts
        run: bun run test:contracts

      - name: Release configuration and deployment checks
        run: node --test scripts/check-release-config.test.mjs scripts/deploy.test.mjs

      - name: Production build
        run: bun run build:release
        env:
          VITE_CONVEX_URL: https://ci-build.convex.cloud
          VITE_WALLETCONNECT_PROJECT_ID: 0123456789abcdef0123456789abcdef
          VITE_GELATO_RELAY_ENABLED: 'false'

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Browser workflows
        run: bun run test:e2e --reporter=line

      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
